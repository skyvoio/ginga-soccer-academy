name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Normalize Replit package URLs for GitHub Actions
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from "node:fs";

          const lockPath = "package-lock.json";
          const lock = JSON.parse(readFileSync(lockPath, "utf8"));
          let replaced = 0;

          for (const pkg of Object.values(lock.packages ?? {})) {
            if (typeof pkg.resolved !== "string") continue;

            const url = new URL(pkg.resolved);
            if (!url.hostname.startsWith("package-firewall.replit.")) continue;
            if (!url.pathname.startsWith("/npm/")) {
              throw new Error(`Unexpected Replit package URL path: ${url.pathname}`);
            }

            pkg.resolved = `https://registry.npmjs.org/${url.pathname.slice("/npm/".length)}`;
            replaced += 1;
          }

          if (replaced > 0) {
            writeFileSync(lockPath, `${JSON.stringify(lock, null, 2)}\n`);
          }
          console.log(`Normalized ${replaced} package URLs for GitHub Actions.`);
          NODE

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build frontend
        run: npm exec -- vite build --base=/
        env:
          NODE_ENV: production
          VITE_API_BASE_URL: https://ginga-soccer.replit.app

      - name: Prepare direct route entries for GitHub Pages
        run: node scripts/prepare-pages-routes.mjs

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
